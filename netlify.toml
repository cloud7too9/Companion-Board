# Netlify baut alles Sichtbare (Umbau Phase 5): Anzeige unter /, Companion unter /app/, Widget-Dashboard unter /dashboard/.
# Die API läuft woanders (Pi hinter dem Cloudflare-Tunnel); ihre Adresse kommt aus der Umgebungsvariable API_URL
# (in Netlify unter Site configuration → Environment variables setzen, z. B. https://api.mainhubv1.com).
# Ohne API_URL laufen die Seiten im Beispiel-/DEMO-Modus (gut für eine erste Vorschau).
[build]
  command = "bash netlify/bauen.sh"
  publish = "netlify/dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"
