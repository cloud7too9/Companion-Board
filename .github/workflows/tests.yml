# Tests für Board-Server, Widgets und Companion – bei jedem Pull Request und jedem Push auf main.
# Dieselben Befehle wie lokal (planung/UEBERGABE.md, Kapitel 6). Die Screenshots der Playwright-Tests
# (companion/tests/bilder/, darunter die Haltepunkte) hängen als Download „bilder“ am Lauf.
# Actions in Hauptversionen, die auf Node 24 laufen; das Runner-Abbild ist fest (ubuntu-24.04), damit ein
# Wechsel von ubuntu-latest nicht unbemerkt die Tests ändert.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Ein neuer Push auf denselben PR bricht den alten Lauf ab; Läufe auf main laufen immer zu Ende.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  board-server:
    name: Board-Server
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: koordinaten-board/server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: koordinaten-board/server/package-lock.json
      - run: npm ci
      - run: npm test

  widgets:
    name: Widgets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: companion/widgets
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/widgets/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  playwright:
    name: Companion und Dashboard (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            koordinaten-board/server/package-lock.json
            companion/widgets/package-lock.json
            companion/tests/package-lock.json

      # Die Tests starten eigene Board-Prozesse; die brauchen den Server und das Widget-Dashboard
      # (companion/widgets/dist), das seit Bauplan „Sitzung“ (S4) die Anzeige ist.
      - name: Board installieren
        working-directory: koordinaten-board
        run: npm ci --prefix server
      - name: Dashboard installieren und bauen
        working-directory: companion/widgets
        run: |
          npm ci
          npm run build
      - name: Test-Abhängigkeiten und Chromium
        working-directory: companion/tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # alle.mjs läuft nach einem Fehler weiter und listet am Ende alle fehlgeschlagenen Dateien
      - name: Tests
        working-directory: companion/tests
        run: npm test

      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bilder
          path: companion/tests/bilder/
          if-no-files-found: ignore
          retention-days: 14
